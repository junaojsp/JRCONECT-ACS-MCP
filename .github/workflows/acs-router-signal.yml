name: ACS router signal labels
on:
  pull_request:
    paths:
      - 'lib/JrcEquipmentClassification.php'
      - 'api/jrc-router-signal-summary.php'
      - 'assets/js/jrc-router-signal.js'
      - 'scripts/deploy-acs-router-signal.py'
      - 'scripts/deploy-acs-router-signal-v2.py'
      - 'scripts/deploy-acs-no-rx-types.py'
      - 'tests/jrc-equipment-classification.test.php'
      - 'tests/test_deploy_acs_router_signal.py'
      - 'tests/test_jrc_router_signal_js.cjs'
      - 'tests/test_deploy_acs_router_signal_v2.py'
      - 'tests/test_deploy_acs_no_rx_types.py'
      - '.github/workflows/acs-router-signal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: mysqli
      - name: Lint PHP
        run: |
          php -l lib/JrcEquipmentClassification.php
          php -l api/jrc-router-signal-summary.php
          php -l tests/jrc-equipment-classification.test.php
      - name: Test equipment classification
        run: php tests/jrc-equipment-classification.test.php
      - name: JS syntax check
        run: node --check assets/js/jrc-router-signal.js
      - name: Test dashboard router badges and sidebar with fake DOM
        run: node tests/test_jrc_router_signal_js.cjs
      - name: Test safe upgrade of installed JS
        run: python3 tests/test_deploy_acs_router_signal_v2.py
      - name: Verify tri-state RX classifications and guarded deployment
        run: python3 tests/test_deploy_acs_no_rx_types.py
      - name: Test safe overlay planner
        run: python3 tests/test_deploy_acs_router_signal.py
