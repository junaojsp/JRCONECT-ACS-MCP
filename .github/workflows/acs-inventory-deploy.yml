name: ACS inventory deployment safety
on:
  pull_request:
    paths:
      - 'scripts/deploy-acs-inventory.py'
      - 'tests/test_deploy_acs_inventory.py'
      - '.github/workflows/acs-inventory-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - run: python3 -m py_compile scripts/deploy-acs-inventory.py
      - run: python3 -m unittest discover -s tests -p 'test_deploy_acs_inventory.py' -v
