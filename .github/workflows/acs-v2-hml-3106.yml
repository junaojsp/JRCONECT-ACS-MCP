name: ACS V2 isolated HML 3106
on:
  pull_request:
    paths:
      - 'scripts/acs-v2-hml-3106.py'
      - 'tests/acs_v2_hml_3106_test.py'
      - 'scripts/README-acs-v2-hml-3106.md'
      - '.github/workflows/acs-v2-hml-3106.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/acs-v2-hml-3106.py'
      - 'tests/acs_v2_hml_3106_test.py'
      - '.github/workflows/acs-v2-hml-3106.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/acs-v2-hml-3106.py tests/acs_v2_hml_3106_test.py
      - run: python3 -m unittest discover -s tests -p 'acs_v2_hml_3106_test.py' -v
