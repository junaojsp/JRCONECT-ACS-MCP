name: Opa MCP bluegreen safety
on:
  pull_request:
    paths:
      - 'scripts/opa-mcp-bluegreen.py'
      - 'tests/opa-mcp-bluegreen-smoke.py'
      - '.github/workflows/opa-mcp-bluegreen.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/opa-mcp-bluegreen.py'
      - 'tests/opa-mcp-bluegreen-smoke.py'
      - '.github/workflows/opa-mcp-bluegreen.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/opa-mcp-bluegreen.py tests/opa-mcp-bluegreen-smoke.py
      - run: python3 tests/opa-mcp-bluegreen-smoke.py
