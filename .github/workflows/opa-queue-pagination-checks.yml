name: Opa queue pagination safety checks
on:
  pull_request:
    paths:
      - 'mcp/integrations/opa-queue-summary.js'
      - 'tests/opa-queue-summary.test.mjs'
      - '.github/workflows/opa-queue-pagination-checks.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/integrations/opa-queue-summary.js'
      - 'tests/opa-queue-summary.test.mjs'
      - '.github/workflows/opa-queue-pagination-checks.yml'
permissions:
  contents: read
jobs:
  test-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check mcp/integrations/opa-queue-summary.js
      - run: node --test tests/opa-queue-summary.test.mjs
